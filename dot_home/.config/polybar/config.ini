;[colors]
;background = #161616
;background-alt = #282828
;foreground = #C5C8C6
;primary = #DBC704
;secondary = #52bdff
;alert = #DBC704
;disabled = #4e5b55
;border = #0f2923

[colors]
; This injects the pywal variables straight into the [colors] block
include-file = ~/.cache/wal/colors-polybar

[bar/top]
width = 100%
height = 24pt
radius = 6
type = internal/tray
tray-spacing = 8px
tray-size = 60%

; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}
background-alt = ${colors.background-alt}
foreground-alt = ${colors.foreground-alt}
primary = ${colors.primary}
secondary = ${colors.secondary}
alert = ${colors.alert}
disabled = ${colors.disabled}



line-size = 3pt

border-size = 2pt
border-color = #00000000

padding-left = 0
padding-right = 2

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

#font-0 = monospace;2
font-1 = "JetBrainsMono Nerd Font Mono:size=10"
font-0 = "RobotoMono Nerd Font:style=Regular:size=12:weight=medium:3"
# font-0 = "Roboto Mono Nerd Font:size=11:weight=medium"

modules-left = launcher xworkspaces 

modules-center = xwindow

# modules-right = filesystem pulseaudio xkeyboard memory cpu wlan eth date
modules-right = filesystem pulseaudio memory cpu date hour lock screenshot powermenu tray



cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; wm-restack = generic
; wm-restack = bspwm
; wm-restack = i3

override-redirect = false



; This module is not active by default (to enable it, add it to one of the
; modules-* list above).
; Please note that only a single tray can exist at any time. If you launch
; multiple bars with this module, only a single one will show it, the others
; will produce a warning. Which bar gets the module is timing dependent and can
; be quite random.
; For more information, see the documentation page for this module:
; https://polybar.readthedocs.io/en/stable/user/modules/tray.html
[module/systray]
type = internal/tray

format-margin = 8pt
tray-spacing = 16pts


[module/launcher]
type = custom/text
content = 

; "content" has the same properties as "format-NAME"
content-background = ${color.primary}
content-foreground = ${color.foreground}
content-padding = 0

; "click-(left|middle|right)" will be executed using "/usr/bin/env sh -c $COMMAND"
click-left = xfce4-appfinder &



[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 2

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = "."
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/filesystem]
type = internal/fs
interval = 25
mount-0 = /
label-mounted = %{F#F0C674}%mountpoint%%{F-} %percentage_used%%
label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>

label-volume = %percentage%%

label-muted = muted
label-muted-foreground = ${colors.disabled}

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = %layout%
label-layout-foreground = ${colors.primary}

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/lock]
type = internal/xkeyboard
;ignore :
format-margin = 0
blacklist-0 = num lock
blacklist-1 = scroll lock
format = <label-indicator>
label-indicator-padding = 0
indicator-icon-0 = caps lock;-CL;+CL
label-indicator-off =
label-indicator-on = "  Caps "
format-foreground = ${colors.background}
format-background = ${colors.alert}



[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %{F#F0C674}%ifname%%{F-} %essid% %local_ip%

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#F0C674}%ifname%%{F-} %local_ip%

;;;;;;;;;;;;;;;; CENTER MODULES ;;;;;;;;;;;;;;;;

[module/hour]
type = internal/date
interval = 5
label-foreground = ${colors.foreground}
date = %l:%M %p
label = %date%
label-padding = 0
label-font = 1

[module/date]
type = custom/script
interval = 5
label-foreground = ${colors.disabled}
format = <label>
exec = "LC_TIME="en_us_utf8" date +"%a, %b %-d""
label-padding = 0
label-font = 1
click-left = gsimplecal

;;;;;;;;;;;;;;;; RIGHT MODULES ;;;;;;;;;;;;;;;;


[module/screenshot]
type = custom/text
format = 󰻛
format-foreground = ${colors.secondary}
click-left = flameshot gui

[module/powermenu]
type = custom/text
format = 󰐥
format-foreground = ${colors.alert}
click-left = ~/.config/openbox/scripts/power

[module/tray]
type = internal/tray
tray-spacing = 4px




[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
